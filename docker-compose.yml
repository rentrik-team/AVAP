# AVAP — PostgreSQL + FastAPI backend (with Nmap) + Next.js UI.
#
# One compose file, used everywhere. Routing is declared here with Traefik
# labels rather than in the Dokploy UI: the UI only injects labels into
# services that already have a `labels:` block, which is why the frontend
# was never given a router and fell through to Traefik's catch-all
# ("404 page not found" under TRAEFIK DEFAULT CERT).
#
# Set in the Dokploy Environment tab (or a local .env file):
#
#   POSTGRES_PASSWORD   database password
#   FRONTEND_DOMAIN     UI hostname   e.g. avap.rentrik.in
#   BACKEND_DOMAIN      API hostname  e.g. api-avap.rentrik.in
#   OPENROUTER_API_KEY  optional; blank disables AI remediation only
#
# Hostnames only — no scheme, no trailing slash. BACKEND_DOMAIN is compiled
# into the browser bundle at BUILD time, so changing it needs a Redeploy,
# not a Restart.
#
# Running it outside Dokploy: `docker network create dokploy-network` once,
# then `docker compose up -d --build`.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avap}
      POSTGRES_USER: ${POSTGRES_USER:-avap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - avap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avap_user} -d ${POSTGRES_DB:-avap}"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Default network only — never reachable from Traefik or the internet.

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-avap}
      POSTGRES_USER: ${POSTGRES_USER:-avap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      # The UI is served over https, so the allowed origin is https too.
      CORS_ALLOWED_ORIGINS: https://${FRONTEND_DOMAIN:?Set FRONTEND_DOMAIN}
      SCAN_TIMEOUT: ${SCAN_TIMEOUT:-300}
      AI_PROVIDER: openrouter
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.1-8b-instruct:free}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-30}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1024}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - avap_scan_output:/data/scan_output
      - avap_reports:/data/generated_reports
      - avap_logs:/data/logs
    # `default` reaches the database; `dokploy-network` is where Traefik looks.
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      # Multi-homed container — tell Traefik which IP to route to.
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.avap-backend.rule=Host(`${BACKEND_DOMAIN:?Set BACKEND_DOMAIN}`)"
      - "traefik.http.routers.avap-backend.entrypoints=websecure"
      - "traefik.http.routers.avap-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.avap-backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.avap-backend-http.rule=Host(`${BACKEND_DOMAIN}`)"
      - "traefik.http.routers.avap-backend-http.entrypoints=web"
      - "traefik.http.routers.avap-backend-http.middlewares=avap-https"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle at build time (NEXT_PUBLIC_*). The
        # browser calls the API directly, so this must be the public https
        # URL — an http URL is blocked as mixed content on an https page.
        NEXT_PUBLIC_API_BASE_URL: https://${BACKEND_DOMAIN:?Set BACKEND_DOMAIN}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.avap-frontend.rule=Host(`${FRONTEND_DOMAIN:?Set FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.avap-frontend.entrypoints=websecure"
      - "traefik.http.routers.avap-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.avap-frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.avap-frontend-http.rule=Host(`${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.avap-frontend-http.entrypoints=web"
      - "traefik.http.routers.avap-frontend-http.middlewares=avap-https"
      # Defined once here; referenced by both services above.
      - "traefik.http.middlewares.avap-https.redirectscheme.scheme=https"

networks:
  # Created by Dokploy on install; shared with the Traefik container.
  dokploy-network:
    external: true

volumes:
  avap_pgdata:
  avap_scan_output:
  avap_reports:
  avap_logs:
