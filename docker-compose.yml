# AVAP — full stack: PostgreSQL + FastAPI backend (with Nmap) + Next.js UI.
#
# Configuration comes from a root-level `.env` file (copy env.docker.example
# to `.env` and edit). See deployment.md for the complete guide.
#
# The frontend and backend only communicate over REST — the browser calls
# the backend directly at FRONTEND_API_BASE_URL, which is why that value is
# a *build* argument (NEXT_PUBLIC_* is baked into the browser bundle).

name: avap

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avap}
      POSTGRES_USER: ${POSTGRES_USER:-avap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - avap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avap_user} -d ${POSTGRES_DB:-avap}"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Not published to the host by default — the backend reaches it on the
    # internal network. Uncomment to inspect the DB from the host:
    # ports:
    #   - "5432:5432"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-avap}
      POSTGRES_USER: ${POSTGRES_USER:-avap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SCAN_TIMEOUT: ${SCAN_TIMEOUT:-300}
      AI_PROVIDER: openrouter
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.1-8b-instruct:free}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-30}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1024}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Data directories are fixed inside the image (/data/...) — see
      # backend/Dockerfile. They persist via the named volumes below.
    volumes:
      - avap_scan_output:/data/scan_output
      - avap_reports:/data/generated_reports
      - avap_logs:/data/logs
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # URL the BROWSER uses to reach the backend — usually the host
        # machine's address + the published backend port, NOT "backend:8000".
        NEXT_PUBLIC_API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  avap_pgdata:
  avap_scan_output:
  avap_reports:
  avap_logs:
