[project]
name = "avap"
version = "1.0.0"
description = "Automated Vulnerability Assessment Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "alembic>=1.14.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "reportlab>=4.0.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "SIM"]
ignore = [
    "S101",  # assert is required in pytest
    # FastAPI's dependency-injection idiom is `param: T = Depends(...)`;
    # this is the framework-mandated pattern (development_standards.md
    # "Dependency Injection"), not a mutable-default-argument bug.
    "B008",
    # str+Enum mixins back every persisted enum column, the audit event
    # taxonomy, and Pydantic (de)serialization. Switching to enum.StrEnum
    # is a behavior-risking change to a frozen/high-scrutiny surface for a
    # purely cosmetic gain; not undertaken without a deliberate decision.
    "UP042",
    # AppException is the established base for the whole custom exception
    # hierarchy (development_standards.md "Exception Naming" documents the
    # *subclass* suffix convention, e.g. TargetNotFoundException); renaming
    # the base class itself is a wide, purely cosmetic rename.
    "N818",
    # SuccessResponse[T]/ErrorResponse are used by every route in the API;
    # migrating Generic[T] to PEP 695 syntax is a cosmetic modernization
    # with no behavior change, deferred to avoid touching this surface
    # without a dedicated review.
    "UP046",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
