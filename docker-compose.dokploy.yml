# AVAP — Dokploy (Traefik) deployment.
#
# Use this file instead of docker-compose.yml when deploying through Dokploy;
# set the Compose Path in the Dokploy UI to `docker-compose.dokploy.yml`.
# docker-compose.yml remains the single-host/localhost file — see readme.md.
#
# What this file changes, and why:
#
#   1. `frontend` and `backend` join the external `dokploy-network`. Traefik's
#      Docker provider only discovers containers on that network; a Compose
#      stack left on its own default network is invisible to it, and every
#      request falls through to Traefik's catch-all — a bare
#      "404 page not found" served under its self-signed TRAEFIK DEFAULT CERT,
#      with no Let's Encrypt certificate ever requested. This was the actual
#      cause of the 404: the app and its environment were fine, the containers
#      were simply unreachable from the proxy.
#   2. No host ports are published. Traefik reaches the containers over
#      dokploy-network, so nothing can collide with other stacks on the host.
#   3. `db` stays on a private network and is never exposed.
#
# Routing itself is owned by the Dokploy UI (Domains tab), which generates the
# Traefik routers:
#
#   frontend  ->  port 3000, HTTPS, cert letsencrypt
#   backend   ->  port 8000, HTTPS, cert letsencrypt
#
# Deliberately no traefik.http.* labels here: two routers matching the same
# Host() rule is ambiguous. The one Traefik label kept is on `backend`, which
# is attached to two networks — without it Traefik may pick the wrong
# container IP.
#
# Required environment variables (Dokploy UI -> Environment). These configure
# the application, not the routing, and are required even though the domains
# are managed in the UI:
#
#   POSTGRES_PASSWORD   database password
#   FRONTEND_DOMAIN     hostname of the UI  (e.g. avap.rentrik.in)
#   BACKEND_DOMAIN      hostname of the API (e.g. api-avap.rentrik.in)
#   OPENROUTER_API_KEY  optional; blank disables AI remediation only
#
# Hostnames only — no scheme, no trailing slash; https:// is added below.
# BACKEND_DOMAIN is compiled into the browser bundle at BUILD time, so
# changing it needs a Redeploy, not a Restart.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avap}
      POSTGRES_USER: ${POSTGRES_USER:-avap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the Dokploy environment}
    volumes:
      - avap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avap_user} -d ${POSTGRES_DB:-avap}"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Private network only — unreachable from Traefik.
    networks:
      - internal

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-avap}
      POSTGRES_USER: ${POSTGRES_USER:-avap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the Dokploy environment}
      # The UI is served over https, so the allowed origin is https too.
      CORS_ALLOWED_ORIGINS: https://${FRONTEND_DOMAIN:?Set FRONTEND_DOMAIN in the Dokploy environment}
      SCAN_TIMEOUT: ${SCAN_TIMEOUT:-300}
      AI_PROVIDER: openrouter
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.1-8b-instruct:free}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-30}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1024}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - avap_scan_output:/data/scan_output
      - avap_reports:/data/generated_reports
      - avap_logs:/data/logs
    # Reaches the database on `internal`; reached by Traefik on dokploy-network.
    networks:
      - internal
      - dokploy-network
    labels:
      # This container is multi-homed — tell Traefik which network to route on.
      - "traefik.docker.network=dokploy-network"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle at build time (NEXT_PUBLIC_*). The
        # browser calls the API directly, so this must be the public https
        # URL — an http URL is blocked as mixed content on an https page.
        NEXT_PUBLIC_API_BASE_URL: https://${BACKEND_DOMAIN:?Set BACKEND_DOMAIN in the Dokploy environment}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dokploy-network

networks:
  # Private stack network: database + backend only.
  internal:
    driver: bridge
  # Created by Dokploy on install; shared with the Traefik container.
  dokploy-network:
    external: true

volumes:
  avap_pgdata:
  avap_scan_output:
  avap_reports:
  avap_logs:
